<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- progress ring: three quarters done -->
  <circle cx="512" cy="512" r="262" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="72"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="url(#ring)" stroke-width="72" stroke-linecap="round"
          stroke-dasharray="1235 1647" transform="rotate(-90 512 512)"/>
  <!-- the tick in the middle -->
  <path d="M410 520 L486 596 L624 438" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
