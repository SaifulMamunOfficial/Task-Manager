<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="giver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="taker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="right"><circle cx="612" cy="512" r="236"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- two people / two hands: the one who gives (left) and the one who receives (right) -->
  <circle cx="412" cy="512" r="236" fill="url(#giver)"/>
  <circle cx="612" cy="512" r="236" fill="url(#taker)"/>
  <!-- where the hand-over happens: the shared part is white, with the tick of "accepted" -->
  <circle cx="412" cy="512" r="236" fill="#ffffff" clip-path="url(#right)"/>
  <path d="M448 520 L492 566 L578 458" fill="none" stroke="#4338ca" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
