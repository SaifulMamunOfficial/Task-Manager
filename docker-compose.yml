# Local development services. In production, create these as Coolify resources instead.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: tm_dev_password
      POSTGRES_DB: taskmanager
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # Dev only. Official MinIO images are no longer published; this is a frozen Bitnami copy (no security updates).
  # Production should use Coolify S3-compatible storage or another maintained S3 server (see README).
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
      MINIO_DEFAULT_BUCKETS: task-attachments
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/bitnami/minio/data"]
volumes:
  pgdata:
  miniodata:
